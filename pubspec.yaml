name: rachas
description: Rachas, app de hábitos con rachas y comodines para estudiantes universitarios.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  provider: ^6.1.5
  dio: ^5.9.0
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.0.1
  timezone: ^0.11.0
  intl: ^0.20.2
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  firebase_crashlytics: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
